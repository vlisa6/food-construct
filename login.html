<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Food Construct</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.login-page {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            color: #3d2f1f;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.login-page::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 36, 24, 0.5);
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
        }

        .login-form {
            background-color: rgba(251, 252, 245, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(107, 123, 58, 0.4);
        }

        .login-form h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #3d2f1f;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 3px solid #6b7b3a;
            display: inline-block;
            width: 100%;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 500;
            color: #3d2f1f;
            margin-bottom: 10px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 15px 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: #3d2f1f;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #c5cba8;
            border-radius: 10px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6b7b3a;
            box-shadow: 0 0 0 4px rgba(107, 123, 58, 0.2);
            background-color: #ffffff;
        }

        .checkbox-group {
            margin: 25px 0;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: #5a4a35;
            font-weight: 400;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #6b7b3a;
            cursor: pointer;
        }

        .submit-btn {
            display: inline-block;
            background-color: #6b7b3a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            padding: 16px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #556630;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 18px;
        }

        .back-link a {
            color: #5a4a35;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #6b7b3a;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body.login-page {
                font-size: 18px;
                padding: 15px;
            }

            .login-form {
                padding: 30px 25px;
            }

            .login-form h2 {
                font-size: 28px;
            }

            .form-group label,
            .form-group input,
            .checkbox-label {
                font-size: 17px;
            }

            .submit-btn {
                font-size: 18px;
                padding: 14px 30px;
            }
        }
    </style>
</head>
<body class="login-page">

    <div class="login-wrapper">
        <form action="https://httpbin.org/post" method="POST" class="login-form">
            <h2>Вход в систему</h2>

            <div class="form-group">
                <label for="login">Логин:</label>
                <input type="text" id="login" name="login" placeholder="Введите логин" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="yes">
                    Запомнить меня
                </label>
            </div>

            <button type="submit" class="submit-btn">Войти</button>

            <p class="back-link">
                <a href="index.html">← Вернуться на главную</a>
            </p>
        </form>
    </div>

</body>
</html>
